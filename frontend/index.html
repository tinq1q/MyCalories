<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calories — дневник питания</title>
    <script>
      // Apply the saved theme before the first paint (no Citrus flash).
      try {
        var t = JSON.parse(localStorage.getItem('sitefood:v1')).theme
        if (['citrus', 'sunset', 'ocean', 'night'].indexOf(t) >= 0) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
