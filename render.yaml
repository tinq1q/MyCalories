services:
  - type: web
    name: mycalories-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # set in the Render dashboard, e.g. https://<login>.github.io
      - key: PYTHON_VERSION
        value: 3.12.8 # match the version the project is developed and tested with
